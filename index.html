<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: blue;
            background-color: yellow;
            text-align: center;
            text-decoration: underline;
            padding: 10px;
            margin-bottom: 10px;
        }

        h2 {
            color: rgb(65, 171, 7);
            text-decoration: wavy underline;
            margin-bottom: 15px;
        }

        /* Form Layout */
        .form-group {
            font-size: 18px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 15px;
        }

        input,
        select,
        textarea,
        button {
            padding: 8px;
            font-size: 16px;
            width: 100%;
        }

        /* Checkbox & Radio Alignment */
        .row-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .row-group input[type="checkbox"],
        .row-group input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        /* Options List */
        ul.options-list {
            list-style: none;
            /* Dots hatane ke liye */
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
        }

        ul.options-list li {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <main>
        <form action="submit_form.php" method="POST">
            <h1>Contact Form</h1>
            <h2>Contact Form</h2>

            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="city">City:</label>
                <input type="text" id="city" name="city" placeholder="Enter your city" required>
            </div>

            <div class="form-group">
                <label for="pincode">Pin Code:</label>
                <input type="number" id="pincode" name="pincode" placeholder="Enter your pin code" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" placeholder="Enter your message" required></textarea>
            </div>

            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group row-group">
                <input type="checkbox" id="subscribe" name="subscribe">
                <label for="subscribe">I am ready to share my information</label>
            </div>

            <div class="form-group">
                <label>Select your options:</label>
                <ul class="options-list">
                    <li>
                        <input type="radio" id="option1" name="options" value="option1" required>
                        <label for="option1">Option 1</label>
                    </li>
                    <li>
                        <input type="radio" id="option2" name="options" value="option2" required>
                        <label for="option2">Option 2</label>
                    </li>
                </ul>
            </div>

            <div class="form-group">
                <label for="dropdown">Dropdown Options:</label>
                <select name="dropdown" id="dropdown" required>
                    <option value="">Select an option</option>
                    <option value="option1">Option 1</option>
                    <option value="option2">Option 2</option>
                    <option value="option3">Option 3</option>
                </select>
            </div>

            <div class="form-group">
                <button type="submit">Submit</button>
            </div>
        </form>
    </main>
</body>

</html>
